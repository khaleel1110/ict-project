<header id="header" class="header bg-white navbar navbar-expand-lg navbar-end navbar-sticky-lg-top navbar-light" style="overflow: hidden">
  <div class="container-fluid">
    <nav class="js-mega-menu navbar-nav-wrap">

      <!-- Logo -->
      <a class="navbar-brand" routerLink="/" aria-label="ICT Support">
        <img style="height: 4rem; object-fit: cover" src="/kustwudil_logo.png" alt="Logo">
      </a>

      <!-- Mobile toggler (opens the offcanvas menu below) -->
      <button class="navbar-toggler" (click)="open(content)" aria-label="Open menu">
        <i class="bi-list"></i>
      </button>

      <!-- Offcanvas menu: shown on small screens -->
      <ng-template #content let-offcanvas>
        <div class="offcanvas-header">
          <h4 class="offcanvas-title" id="offcanvas-basic-title">
            <a class="navbar-brand" routerLink="/" aria-label="ICT Support">
              <img style="height: 4rem; object-fit: cover" src="/kustwudil_logo.png" alt="Logo">
            </a>
          </h4>
          <button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss('Cross click')"></button>
        </div>

        <div class="offcanvas-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" routerLink="/home" routerLinkActive="active" role="button">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/report-issue" routerLinkActive="active" role="button">Report issue</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/track" routerLinkActive="active" role="button">Track status</a>
            </li>
          </ul>
        </div>

        <div class="offcanvas-footer">
          <div class="mb-6 px-5 mx-3 gx-2 g-3 text-center">
            <a class="btn btn-outline-secondary btn-sm btn-transition mt-2" routerLink="/admin/login">
              <i class="bi-shield-lock"></i> Admin
            </a>
          </div>
        </div>
      </ng-template>

      <!-- Desktop nav: shown on large screens (Bootstrap's navbar-expand-lg handles this) -->
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active" role="button">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/report-issue" routerLinkActive="active" role="button">Report issue</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/track" routerLinkActive="active" role="button">Track status</a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a routerLink="/admin/login" routerLinkActive="active" class="btn btn-soft-dark btn-transition">
              <i class="bi-shield-lock"></i> Admin
            </a>
          </li>
        </ul>
      </div>

    </nav>
  </div>
</header>
